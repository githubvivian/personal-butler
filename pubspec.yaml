name: personal_butler
description: 个人管家 - 本地加密、中文OCR、家庭日程管理
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  sqflite_sqlcipher: ^3.1.0+1
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  google_mlkit_text_recognition: ^0.14.0
