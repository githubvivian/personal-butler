  timezone: ^0.10.0
  flutter_timezone: ^5.1.0
  intl: ^0.20.1
  lunar: ^1.7.0
  encrypt: ^5.0.3
  crypto: ^3.0.6
  uuid: ^4.5.1
  file_picker: ^11.0.2
  share_plus: ^10.1.3
  table_calendar: ^3.1.3
  collection: ^1.19.0
  shared_preferences: ^2.3.3
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
